backend:
  name: github
  repo: vikram-gsu/vrblog
  branch: main
  auth_type: pkce
  app_id: "Ov23ligDyKVyHycatdpP"

site_url: https://vikrampareddy.com

media_folder: public/assets/blog
public_folder: /assets/blog

collections:
  - name: blog
    label: Blog Posts
    folder: content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    fields:
      - label: Title
        name: title
        widget: string
      - label: Date
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: Read Time
        name: readTime
        widget: string
        default: "5 min"
      - label: Excerpt
        name: excerpt
        widget: text
      - label: Tags
        name: tags
        widget: list
        field:
          label: Tag
          name: tag
          widget: string
      - label: Featured
        name: featured
        widget: boolean
        default: false
      - label: Featured Image
        name: image
        widget: image
        required: false
      - label: Body
        name: body
        widget: markdown

  - name: series
    label: Series
    folder: content/series
    create: true
    nested:
      depth: 2
    meta:
      path:
        widget: string
        label: Path
        index_file: index
    fields:
      - label: Title
        name: title
        widget: string
      - label: Description
        name: description
        widget: text
      - label: Date
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
      - label: Read Time
        name: readTime
        widget: string
        default: "5 min"
        required: false
      - label: Excerpt
        name: excerpt
        widget: text
        required: false
      - label: Body
        name: body
        widget: markdown

  - name: tracker
    label: Tracker
    files:
      - name: log
        label: Daily log
        file: content/tracker/log.yaml
        format: yaml
        fields:
          - label: Entries
            name: entries
            widget: list
            add_to_top: false
            summary: "{{fields.date}} · {{fields.task}} · {{fields.minutes}} min"
            fields:
              - label: Date
                name: date
                widget: datetime
                format: "YYYY-MM-DD"
                date_format: "YYYY-MM-DD"
                time_format: false
              - label: Task
                name: task
                widget: select
                options:
                  - { label: "LLM From Scratch (Raschka)", value: llm-from-scratch }
                  - { label: "DDIA", value: ddia }
                  - { label: "System Design Interview (Xu)", value: system-design-xu }
                  - { label: "Blogs & papers", value: blogs-papers }
                  - { label: "LeetCode", value: leetcode }
                  - { label: "Building agents", value: agents }
                  - { label: "Agent harnesses", value: agent-harnesses }
                  - { label: "Experiments", value: experiments }
                  - { label: "Stanford Algorithms lectures", value: algorithms-lectures }
                  - { label: "System design lab", value: system-design-lab }
              - label: Minutes
                name: minutes
                widget: number
                value_type: int
                required: false
              - label: Note
                name: note
                widget: string
                required: false
              - label: Finished items (ids from queue.yaml)
                name: done
                widget: list
                required: false
