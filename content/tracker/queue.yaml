  system-design-lab:
    # Breakscale, LLM inference, the GenAI System Design Interview book, labs on the server, mocks.
    hours: 2
    items:
      - {"id": "lab-1", "title": "Breakscale: rebuild Xu Ch 1 (LB, app, cache, DB + replica); push load until p99 breaks, note the numbers", "link": "https://breakscale.tech"}
      - {"id": "lab-2", "title": "GenAI System Design Interview Ch 1 · the framework", "link": "https://bytebytego.com/courses/genai-system-design-interview"}
      - {"id": "lab-3", "title": "LLM Inference Handbook · foundations: prefill vs decode, TTFT, tokens/sec, KV cache", "link": "https://handbook.modular.com"}
      - {"id": "lab-4", "title": "GenAI System Design Interview · the chatbot chapter (read only; you'll design it in a mock)", "link": "https://bytebytego.com/courses/genai-system-design-interview"}
      - {"id": "lab-5", "title": "LLM Inference Handbook · batching (static vs continuous), PagedAttention", "link": "https://handbook.modular.com"}
      - {"id": "lab-6", "title": "Design: an LLM inference API (streaming, rate limits, multi-tenant)"}
      - {"id": "lab-7", "title": "Lab: Ollama on the server; load test at 1, 4, 16 concurrent users; chart TTFT and tokens/sec"}
      - {"id": "lab-8", "title": "GenAI System Design Interview · the RAG chapter", "link": "https://bytebytego.com/courses/genai-system-design-interview"}
      - {"id": "lab-9", "title": "Lab: small RAG service on the server with pgvector; retrieval vs generation latency"}
      - {"id": "lab-14", "title": "Breakscale: retry storms, circuit breakers, backpressure, applied to an LLM gateway", "link": "https://breakscale.tech"}
      - {"id": "lab-15", "title": "Vidur: estimate a serving setup by hand, then find the cheapest config that meets a latency SLO", "link": "https://github.com/microsoft/vidur"}
      - {"id": "lab-10", "title": "Mock: URL shortener, 45 min, written up", "hours": 1}
      - {"id": "lab-11", "title": "Mock: an LLM-powered support chatbot, 45 min, written up", "hours": 1}
      - {"id": "lab-12", "title": "Mock: RAG over company docs, 45 min", "hours": 1}
      - {"id": "lab-13", "title": "Mock: an inference batching system for a single GPU, 45 min", "hours": 1}
  agents:
    # Home server first, then the movie agent.
    hours: 2
    items:
      - {"id": "agents-1", "title": "Server: inventory the machine (CPU, RAM, disk, GPU?); install Ubuntu Server 24.04 LTS, SSH keys only"}
      - {"id": "agents-2", "title": "Server: DHCP reservation; harden it (ufw, unattended-upgrades, no password SSH); add Tailscale"}
      - {"id": "agents-3", "title": "Server: Docker + compose; Ollama + a small model (the load-test lab uses it)"}
      - {"id": "agents-4", "title": "Server: a hello service you can reach from your phone over Tailscale; Claude API key in place"}
      - {"id": "agents-5", "title": "Agent: a minimal agent loop on the server against the Claude API, one tool"}
      - {"id": "agents-6", "title": "WhatsApp: run scripts/setup-whatsapp.sh so the tracker bot is live"}
      - {"id": "agents-7", "title": "WhatsApp: receive webhooks on the server via Tailscale Funnel"}
      - {"id": "agents-8", "title": "Approvals: agent asks yes/no on WhatsApp before a gated tool call"}
      - {"id": "agents-9", "title": "Browser: Playwright on the server; headless navigate a showtimes page"}
      - {"id": "agents-10", "title": "Movie agent v0: find showtimes for a movie + theater (read-only)"}
      - {"id": "agents-11", "title": "Movie agent: look up coupons and card offers, compare total price"}
      - {"id": "agents-12", "title": "Movie agent: propose a booking plan and ask for approval on WhatsApp"}
      - {"id": "agents-13", "title": "Movie agent: drive checkout up to the payment page, stop there (dry run)"}
      - {"id": "agents-14", "title": "Reliability: retries, timeouts, structured logs for every run"}
      - {"id": "agents-15", "title": "Demo + write-up: blog post on what worked and what didn't"}
  agent-harnesses:
    hours: 2
    items:
      - {"id": "harness-1", "title": "Study: how agent harnesses work (agent loop, tools, permissions); sketch your design"}
      - {"id": "harness-2", "title": "Agent loop from scratch: messages, tool calls, stop conditions, no framework"}
      - {"id": "harness-3", "title": "Tool registry: JSON schemas, validation, sandboxed execution in Docker"}
      - {"id": "harness-4", "title": "Permission layer: allow / deny / ask, with 'ask' routed to WhatsApp"}
      - {"id": "harness-5", "title": "Memory and observability: persist and compact conversations; trace every step to JSONL"}
      - {"id": "harness-6", "title": "Evals: a handful of scripted tasks, run and score them; refactor and publish the repo"}
  experiments:
    hours: 2
    items: []
