# Each track's work, in order. The schedule (schedule.yaml) gives each track blocks of time;
# a block shows the track's next unfinished items, by their estimated hours.
# An item is finished when a log entry lists its id under `done`.
#   hours: the track's default estimate per item; an item can override it.
# Edit freely: reorder, insert (any new unique id), or drop items.
tracks:
  llm-from-scratch:
    hours: 2
    items:
      - {"id": "llm-ch1", "title": "Ch 1 · Understanding large language models"}
      - {"id": "llm-a1-4", "title": "Appendix A · A.1–A.4 PyTorch tensors and autograd"}
      - {"id": "llm-a5-9", "title": "Appendix A · A.5–A.9 Multilayer nets, data loaders, training loop, GPU"}
      - {"id": "llm-2a", "title": "Ch 2 · 2.1–2.4 Word embeddings, tokenizing, token IDs, special tokens"}
      - {"id": "llm-2b", "title": "Ch 2 · 2.5–2.8 Byte pair encoding, sliding-window sampling, token + positional embeddings"}
      - {"id": "llm-3a", "title": "Ch 3 · 3.1–3.4 Why attention; simple self-attention; trainable weights"}
      - {"id": "llm-3b", "title": "Ch 3 · 3.5–3.6 Causal attention, dropout, multi-head attention"}
      - {"id": "llm-4a", "title": "Ch 4 · 4.1–4.3 GPT architecture, layer norm, GELU feed-forward"}
      - {"id": "llm-4b", "title": "Ch 4 · 4.4–4.7 Shortcut connections, transformer block, assemble GPT, generate text"}
      - {"id": "llm-kv", "title": "Bonus · Add a KV cache to your GPT model", "link": "https://github.com/rasbt/LLMs-from-scratch/tree/main/ch04/03_kv-cache"}
      - {"id": "llm-5-1", "title": "Ch 5 · 5.1 Evaluating generative models (loss, perplexity)"}
      - {"id": "llm-5-2", "title": "Ch 5 · 5.2 Training the LLM"}
      - {"id": "llm-5-3", "title": "Ch 5 · 5.3 Decoding: temperature and top-k sampling"}
      - {"id": "llm-5-4", "title": "Ch 5 · 5.4–5.5 Save/load weights, load OpenAI GPT-2 weights"}
      - {"id": "llm-6a", "title": "Ch 6 · 6.1–6.4 Classification fine-tuning: dataset, loaders, init"}
      - {"id": "llm-6b", "title": "Ch 6 · 6.5–6.8 Classification head, loss/accuracy, train, spam classifier"}
      - {"id": "llm-7a", "title": "Ch 7 · 7.1–7.4 Instruction data, batching, data loaders"}
      - {"id": "llm-7b", "title": "Ch 7 · 7.5–7.6 Load pretrained model, instruction fine-tune"}
      - {"id": "llm-7c", "title": "Ch 7 · 7.7–7.9 Extract responses, evaluate with an LLM judge"}
      - {"id": "llm-d", "title": "Appendix D · LR warmup, cosine decay, gradient clipping"}
      - {"id": "llm-e", "title": "Appendix E · Parameter-efficient fine-tuning with LoRA"}
  ddia:
    hours: 2
    items:
      - {"id": "ddia-1", "title": "Transactions · the rest of ACID: isolation, durability; single- vs multi-object operations", "hours": 1}
      - {"id": "ddia-2", "title": "Transactions · Weak isolation: read committed, snapshot isolation, lost updates"}
      - {"id": "ddia-3", "title": "Transactions · Write skew, phantoms; serializability (serial, 2PL, SSI)"}
      - {"id": "ddia-4", "title": "Trouble with Distributed Systems · Faults, partial failures, unreliable networks"}
      - {"id": "ddia-5", "title": "Trouble with Distributed Systems · Unreliable clocks"}
      - {"id": "ddia-6", "title": "Trouble with Distributed Systems · Knowledge, truth and lies (quorums, fencing)"}
      - {"id": "ddia-7", "title": "Consistency & Consensus · Consistency guarantees, linearizability"}
      - {"id": "ddia-8", "title": "Consistency & Consensus · Ordering guarantees, total order broadcast"}
      - {"id": "ddia-9", "title": "Consistency & Consensus · Distributed transactions, 2PC"}
      - {"id": "ddia-10", "title": "Consistency & Consensus · Fault-tolerant consensus, coordination services"}
      - {"id": "ddia-11", "title": "Batch Processing · Unix tools, MapReduce and distributed filesystems"}
      - {"id": "ddia-12", "title": "Batch Processing · Beyond MapReduce: dataflow engines, graphs"}
      - {"id": "ddia-13", "title": "Stream Processing · Transmitting event streams (brokers, logs)"}
      - {"id": "ddia-14", "title": "Stream Processing · Databases and streams (CDC, event sourcing), processing"}
      - {"id": "ddia-15", "title": "Future of Data Systems · Data integration, unbundling databases; aiming for correctness"}
  system-design-xu:
    hours: 2
    items:
      - {"id": "xu-1-2", "title": "Ch 1 · Scale from zero to millions of users; Ch 2 · Back-of-the-envelope estimation"}
      - {"id": "xu-3", "title": "Ch 3 · A framework for system design interviews"}
      - {"id": "xu-4", "title": "Ch 4 · Design a rate limiter"}
      - {"id": "xu-5", "title": "Ch 5 · Design consistent hashing"}
      - {"id": "xu-6", "title": "Ch 6 · Design a key-value store"}
      - {"id": "xu-7-8", "title": "Ch 7 · Design a unique ID generator; Ch 8 · Design a URL shortener"}
      - {"id": "xu-9", "title": "Ch 9 · Design a web crawler"}
      - {"id": "xu-10", "title": "Ch 10 · Design a notification system"}
      - {"id": "xu-11", "title": "Ch 11 · Design a news feed system"}
      - {"id": "xu-12", "title": "Ch 12 · Design a chat system"}
      - {"id": "xu-13", "title": "Ch 13 · Design a search autocomplete system"}
      - {"id": "xu-14", "title": "Ch 14 · Design YouTube"}
      - {"id": "xu-15-16", "title": "Ch 15 · Design Google Drive; Ch 16 · The learning continues"}
  blogs-papers:
    hours: 1.5
    items:
      - {"id": "paper-attention", "title": "Attention Is All You Need (Vaswani et al., 2017)", "link": "https://arxiv.org/abs/1706.03762"}
      - {"id": "paper-effective-agents", "title": "Building effective agents (Anthropic, 2024)", "link": "https://www.anthropic.com/engineering/building-effective-agents"}
      - {"id": "paper-react", "title": "ReAct: Synergizing Reasoning and Acting in LMs (Yao et al., 2022)", "link": "https://arxiv.org/abs/2210.03629"}
      - {"id": "paper-gpt2", "title": "GPT-2: Language Models are Unsupervised Multitask Learners (Radford et al., 2019)", "link": "https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf"}
      - {"id": "paper-raft", "title": "Raft: In Search of an Understandable Consensus Algorithm (Ongaro & Ousterhout, 2014)", "link": "https://raft.github.io/raft.pdf"}
      - {"id": "paper-instructgpt", "title": "InstructGPT: Training LMs to follow instructions (Ouyang et al., 2022)", "link": "https://arxiv.org/abs/2203.02155"}
      - {"id": "paper-context-engineering", "title": "Effective context engineering for AI agents (Anthropic, 2025)", "link": "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"}
      - {"id": "paper-lora", "title": "LoRA: Low-Rank Adaptation of LLMs (Hu et al., 2021)", "link": "https://arxiv.org/abs/2106.09685"}
  algorithms-lectures:
    # At 2×, Optional videos skipped.
    hours: 0.75
    items:
